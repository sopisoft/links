[package]
name = "links"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
image = { version = "0.25.10", features = ["avif", "ico", "jpeg", "png"] }
maud = "0.27"
nanoid = "0.5"
reqwest = { version = "0.13.2", default-features = false, features = [
  "blocking",
  "rustls",
] }
resvg = "0.47"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = [
  "compression-br",
  "compression-gzip"
] }

[profile.release]
opt-level = "z"
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1
